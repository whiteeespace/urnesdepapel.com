<title>Urnes de Papel Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Hanken+Grotesk:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..400&display=swap">
<style>
/* Layout: one quiet centered column under a ruled header; image-over-caption grids labelled like gallery wall cards.
   Single light theme by choice: the brand is white art paper. */
:root {
  --paper: #ffffff;
  --ink: #2a2926;
  --ink-80: #58585a;       /* brand Noir 80 % */
  --muted: #7f7c74;
  --rule: #e3e0d8;
  --ph: #f1efea;           /* placeholder paper */
  --gold: #bfb277;         /* brand PMS 617U, decorative only */
  --gold-ink: #85783f;     /* gold dark enough for focus rings */
  --err: #9a3a2c;
  --f-serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-sans: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono: "Cutive Mono", "Courier New", monospace;
  --gutter: clamp(16px, 4vw, 40px);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-serif); font-size: 17px; line-height: 1.6;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 3px; }

.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* type roles */
.caps { font-family: var(--f-sans); font-weight: 400; text-transform: uppercase; letter-spacing: .2em; font-size: 12px; }
.eyebrow { font-family: var(--f-mono); font-size: 14px; color: var(--muted); letter-spacing: .02em; }
.h1 { font-family: var(--f-serif); font-weight: 400; text-transform: uppercase; letter-spacing: .14em; font-size: clamp(26px, 3.2vw, 36px); line-height: 1.2; }
.h2 { font-family: var(--f-sans); font-weight: 500; text-transform: uppercase; letter-spacing: .2em; font-size: 12.5px; color: var(--ink); }
.lede { font-size: clamp(19px, 2vw, 23px); line-height: 1.5; font-weight: 300; }
.small { font-size: 14.5px; }
.muted { color: var(--muted); }
.num { font-family: var(--f-mono); font-size: 14px; color: var(--ink-80); }
.tbd { color: var(--muted); font-style: italic; text-decoration: underline dashed var(--rule); text-underline-offset: 5px; }

/* prototype band */
.proto { background: var(--ph); color: var(--muted); font-family: var(--f-mono); font-size: 12.5px; }
.proto .wrap { padding-block: 7px; }

/* header */
.site-head { border-bottom: 1px solid var(--rule); }
.site-head .wrap { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-block: 26px 20px; flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink-80); padding-bottom: 3px; border-bottom: 1px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.nav .btn-line { padding: 9px 14px; border: 1px solid var(--ink-80); }
.nav .btn-line[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lang { font-family: var(--f-mono); font-size: 14px; color: var(--muted); display: flex; gap: 6px; }
.lang button { font: inherit; color: inherit; background: none; border: 0; padding: 2px; cursor: pointer; }
.lang button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

/* logo (redrawn: serif U crossed by two paper fibres) */
.logo { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink-80); }
.logo-u { position: relative; font-family: var(--f-serif); font-weight: 400; font-size: 52px; line-height: .8; }
.logo-u svg { position: absolute; left: 50%; top: -42%; height: 190%; width: 14px; transform: translateX(-30%); overflow: visible; }
.logo-u path { fill: none; stroke: currentColor; stroke-width: .7; vector-effect: non-scaling-stroke; }
.logo-txt { display: flex; flex-direction: column; gap: 3px; }
.logo-name { font-family: var(--f-serif); font-size: 19px; letter-spacing: .16em; line-height: 1; }
.logo-tag { font-family: var(--f-sans); font-weight: 300; font-size: 9.5px; letter-spacing: .38em; }
.logo.vertical { flex-direction: column; gap: 18px; text-align: center; color: var(--gold); }
.logo.vertical .logo-u { font-size: 92px; }
.logo.vertical .logo-txt { align-items: center; gap: 6px; color: var(--ink-80); }
.logo.vertical .logo-name { font-size: 20px; }
.logo.vertical .logo-tag { font-size: 10px; }

main { min-height: 50vh; }
.page { padding-block: clamp(36px, 6vw, 72px) clamp(56px, 8vw, 96px); display: flex; flex-direction: column; gap: clamp(36px, 5vw, 56px); }
.page-head { display: flex; flex-direction: column; gap: 14px; max-width: 46rem; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }

/* placeholders */
.ph {
  position: relative; display: grid; place-items: center; overflow: hidden;
  aspect-ratio: 3 / 4; max-width: 100%;
  background-color: var(--tint, var(--ph)); background-image: var(--fibre); background-size: 220px 220px;
}
.ph.wide { aspect-ratio: 4 / 3; }
.ph.square { aspect-ratio: 1; }
.ph svg { height: 76%; width: auto; color: var(--ink-80); transition: transform .5s ease; }
.ph svg .body { fill: rgba(255,255,255,.35); stroke: currentColor; stroke-width: 1; vector-effect: non-scaling-stroke; }
.ph svg .line { fill: none; stroke: currentColor; stroke-width: 1; vector-effect: non-scaling-stroke; }
.ph-tag { position: absolute; left: 10px; bottom: 8px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

/* grids & cards */
.grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 48px 28px; }
.card { display: flex; flex-direction: column; gap: 14px; text-decoration: none; min-width: 0; }
.card:hover .ph svg { transform: translateY(-4px); }
.card .cap { display: flex; flex-direction: column; gap: 6px; }
.card .title { font-family: var(--f-serif); text-transform: uppercase; letter-spacing: .16em; font-size: 18px; }
.card .desc { font-size: 15.5px; line-height: 1.5; }
.card .meta { font-family: var(--f-sans); font-size: 13px; color: var(--muted); }
.card:hover .title, .card:hover .num { text-decoration: underline; text-underline-offset: 4px; }

.values { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.values li { flex: 1 1 200px; list-style: none; padding: 16px 0; color: var(--ink-80); text-align: center; }
.values { margin: 0; padding: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-sans); font-size: 12.5px; text-transform: uppercase; letter-spacing: .18em; text-decoration: none; padding: 14px 20px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
.btn:hover { background: var(--ink-80); border-color: var(--ink-80); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink-80); }
.btn.ghost:hover { background: var(--ph); }
.link { font-family: var(--f-sans); font-size: 12.5px; text-transform: uppercase; letter-spacing: .18em; color: var(--ink-80); text-underline-offset: 5px; }
.row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }

/* urn detail */
.detail { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gallery .main { grid-column: 1 / -1; }
.info { display: flex; flex-direction: column; gap: 22px; }
.specs { margin: 0; border-top: 1px solid var(--rule); }
.specs div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.specs dt { font-family: var(--f-sans); font-size: 11.5px; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); padding-top: 4px; }
.specs dd { margin: 0; font-size: 15.5px; }
.specs .price dd { font-family: var(--f-mono); font-size: 17px; }
.pager { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--rule); padding-top: 18px; }
.pager a { font-family: var(--f-mono); color: var(--ink-80); text-decoration: none; }
.pager a:hover { color: var(--ink); text-decoration: underline; }

/* about */
.about-top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(28px, 5vw, 64px); align-items: end; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; border-top: 1px solid var(--rule); padding-top: 32px; }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block p { font-size: 16px; hyphens: auto; }

/* pricing */
.pricing { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 4vw, 48px); align-items: start; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 24px; }
.opt { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.opt .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.opt .price { font-family: var(--f-mono); font-size: 16px; white-space: nowrap; }
.opt p { font-size: 15px; line-height: 1.5; color: var(--ink-80); }
.base .top .price { font-size: 22px; }
.note { font-family: var(--f-mono); font-size: 14px; color: var(--ink-80); border-left: 1px solid var(--gold); padding-left: 12px; }

/* artisan */
.artisan { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.bio { columns: 2 18rem; column-gap: 40px; }
.bio p { font-size: 16px; margin-bottom: 1em; break-inside: avoid-column; hyphens: auto; }
.contact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; border-top: 1px solid var(--rule); padding-top: 48px; align-items: center; }
.contact-info { display: flex; flex-direction: column; gap: 14px; }
.contact-info .tel { font-family: var(--f-mono); font-size: 20px; color: var(--ink); user-select: all; }

/* request form */
.request { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
form { display: flex; flex-direction: column; gap: 34px; }
fieldset { border: 0; border-top: 1px solid var(--rule); padding: 22px 0 0; margin: 0; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
legend { padding: 0 12px 0 0; font-family: var(--f-sans); font-weight: 500; text-transform: uppercase; letter-spacing: .2em; font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-family: var(--f-sans); font-size: 14px; color: var(--ink-80); }
.req { color: var(--gold-ink); }
.hint { font-family: var(--f-sans); font-size: 13px; color: var(--muted); }
input[type="text"], input[type="email"], input[type="tel"], input[type="date"], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--paper);
  border: 1px solid #cfcbc1; border-radius: 0; padding: 11px 12px; width: 100%; max-width: 100%;
}
textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
[aria-invalid="true"] { border-color: var(--err) !important; }
.err { font-family: var(--f-sans); font-size: 13.5px; color: var(--err); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: block; padding: 10px 16px; border: 1px solid #cfcbc1; font-family: var(--f-sans); font-size: 14px; color: var(--ink-80); cursor: pointer; }
.chip input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip input:focus-visible + span { outline: 2px solid var(--gold-ink); outline-offset: 2px; }
.checks { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.check { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--ink); }
.check .name { font-size: 16px; }
.check .price { font-family: var(--f-mono); font-size: 15px; white-space: nowrap; padding-top: 2px; }
.check.disabled { opacity: .45; cursor: not-allowed; }
.preview { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.preview .ph { aspect-ratio: 3 / 4; }
.preview p { font-size: 14.5px; line-height: 1.45; }
.radios { display: flex; gap: 22px; flex-wrap: wrap; font-family: var(--f-sans); font-size: 15px; }
.radios label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.radios input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
.submit-row { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--rule); padding-top: 24px; }
.inline-est { font-family: var(--f-mono); font-size: 15px; color: var(--ink-80); }
.alert { border: 1px solid var(--err); color: var(--err); padding: 12px 14px; font-family: var(--f-sans); font-size: 14.5px; }
.est { position: sticky; top: 24px; border: 1px solid var(--rule); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.est ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.est li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dotted var(--rule); font-size: 15px; }
.est li span:last-child { font-family: var(--f-mono); white-space: nowrap; }
.est .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.est .total strong { font-family: var(--f-mono); font-weight: 400; font-size: 24px; }
.done { display: flex; flex-direction: column; gap: 24px; max-width: 40rem; }
.done .specs dd { white-space: pre-wrap; overflow-wrap: anywhere; }

/* footer */
.site-foot { border-top: 1px solid var(--rule); }
.site-foot .wrap { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 22px 28px; font-family: var(--f-sans); font-size: 13px; color: var(--muted); }
.site-foot a { color: var(--ink-80); }

@media (max-width: 860px) {
  .detail, .about-top, .pricing, .artisan, .request, .contact { grid-template-columns: minmax(0, 1fr); }
  .cols3 { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .est { position: static; }
  .grid { --cols: 2 !important; gap: 36px 16px; }
  .home .grid { --cols: 3 !important; }
  .artisan .ph { max-width: 360px; }
}
@media (max-width: 600px) {
  .site-head .wrap { flex-direction: column; align-items: flex-start; gap: 22px; padding-block: 22px 16px; }
  .nav { gap: 14px 22px; }
  .home .grid { --cols: 1 !important; }
  .home .ph { aspect-ratio: 4 / 3; }
  .opts, .two { grid-template-columns: minmax(0, 1fr); }
  .logo-u { font-size: 44px; }
  .logo-name { font-size: 16px; }
  .card .desc { font-size: 14.5px; }
  .specs div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { .ph svg { transition: none; } .card:hover .ph svg { transform: none; } }
</style>

<div class="proto"><div class="wrap" id="proto"></div></div>
<header class="site-head"><div class="wrap" id="head"></div></header>
<main id="main"></main>
<footer class="site-foot"><div class="wrap" id="foot"></div></footer>

<script>
(() => {
  // ---------- paper-fibre texture for placeholders ----------
  try {
    const c = document.createElement("canvas"); c.width = c.height = 220;
    const g = c.getContext("2d");
    let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 260; i++) {
      const x = r() * 220, y = r() * 220, len = 10 + r() * 40, a = r() * Math.PI * 2;
      g.strokeStyle = `rgba(110,100,80,${0.05 + r() * 0.07})`; g.lineWidth = 0.6;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a + 0.6) * len * 0.5, y + Math.sin(a + 0.6) * len * 0.5, x + Math.cos(a) * len, y + Math.sin(a) * len);
      g.stroke();
    }
    document.documentElement.style.setProperty("--fibre", `url(${c.toDataURL()})`);
  } catch (e) {}

  // ---------- content (from content/urns.json, canvas urns only) ----------
  const MODELS = [
    { slug: "papillon", name: "Papillon", urns: [23, 30, 38], cols: 3 },
    { slug: "anemone", name: "Anémone", urns: [20, 24, 26, 29, 37, 42], cols: 3 },
    { slug: "tulipe", name: "Tulipe", urns: [22, 35, 43, 44], cols: 4 },
  ];
  const URNS = {
    20: { m: "anemone", tint: "#dcdcd9", fi: ["Abaca blanchi, linter de coton, kozo", "Bleached abaca, cotton linter, kozo"], co: ["Gris argent", "Silver gray"], ma: ["Lavis de pigment naturel et médium acrylique, colle de riz, colle blanche, vernis naturel à base de plante Earth Paint, poudre d’aluminium", "Natural pigment and acrylic medium washes, rice glue, white glue, Earth Paint natural plant-based varnish, aluminum powder"], de: ["Patine aspect pierre, rainures formées par l’insertion de tiges lors du moulage de l’urne.", "Stone-look patina, grooves formed by the insertion of rods at the urn’s molding stage."] },
    22: { m: "tulipe", tint: "#e4e7df", fi: ["Abaca blanchi, linter de coton, kozo", "Bleached abaca, cotton linter, kozo"], co: ["Gris clair, vert pâle, blanc", "Light gray, pale green, almond white"], ma: ["Appliqués de papier fait main, fibres mélangées, pigment naturel, médium acrylique, colle de riz, colle blanche, poudre de konnyaku, poudre d’or", "Appliqués of handmade paper, mixed fibers, natural pigment, acrylic medium, rice glue, white glue, konnyaku powder, gold powder"], de: ["Urne aux reflets gris perle, une texture raffinée ; apaisement et silence.", "Urn with pearl gray reflections, a refined texture; calm and silence."] },
    23: { m: "papillon", tint: "#f0efeb", fi: ["Abaca blanchi, linter de coton, kozo", "Bleached abaca, cotton linter, kozo"], co: ["Blanc neutre", "Neutral white"], ma: ["Papier coton fait main embossé à motif floral, colle de riz, colle blanche, poudre de konnyaku", "Handmade embossed cotton paper with floral pattern, rice glue, white glue, konnyaku powder"], de: ["Une composition florale discrète et réconfortante.", "A discreet and comforting floral arrangement."] },
    24: { m: "anemone", tint: "#e9e1d1", fi: ["Abaca blanchi, linter de coton, kozo", "Bleached abaca, cotton linter, kozo"], co: ["Sable", "Sand"], ma: ["Lavis pigment naturel et médium acrylique, colle de riz, colle blanche, appliqués de papier uzumaki, poudre de konnyaku", "Natural pigment and acrylic medium washes, rice glue, white glue, uzumaki paper appliqués, konnyaku powder"], de: ["Urne avec insertion d’une page d’un livre cher à la personne décédée ou un proche. Agencement rassurant de mots, de papier fait main et d’appliqués d’uzumaki.", "Urn with insertion of a page from a book dear to the deceased or a loved one. Reassuring arrangement of words, handmade paper and uzumaki appliqués."] },
    26: { m: "anemone", tint: "#d3dbcb", fi: ["Abaca blanchi, linter de coton, kozo", "Bleached abaca, cotton linter, kozo"], co: ["Vert français", "French green"], ma: ["Papier fait main embossé, lavis de pigment naturel et médium acrylique, colle de riz, colle blanche, poudre de konnyaku", "Handmade embossed paper, natural pigment and acrylic medium wash, rice glue, white glue, konnyaku powder"], de: ["Sobriété, renouveau et tranquillité.", "Sobriety, renewal and tranquility."] },
    29: { m: "anemone", tint: "#eeebdd", fi: ["Abaca blanchi, linter de coton, kozo", "Bleached abaca, cotton linter, kozo"], co: ["Blanc chaud, vert pâle, or", "Warm white, pale green, gold"], ma: ["Pigment naturel et médium acrylique, colle de riz, colle blanche, papier uzumaki, poudre de konnyaku", "Natural pigment and acrylic medium, rice glue, white glue, uzumaki paper, konnyaku powder"], de: ["Un effet à la fois marbré et rustique.", "A marbled and rustic effect."] },

  // ----- request form -----
  const urnLabel = (num) => `${modelOf(URNS[num].m).name} ${n(num)}`;
  const estimate = () => {
    const lines = [];
    if (form.urn) lines.push([`${t("urnN")} ${urnLabel(+form.urn)}`, 350, 350]);
    else if (form.type !== 2 || Object.values(form.opts).some(Boolean)) lines.push([t("baseUrn"), 350, 350]);
    OPTIONS.forEach((o) => { if (form.opts[o.id] && (o.id !== "pouchc" || form.opts.pouch)) lines.push([o.name[L()], o.price || o.min, o.price || o.max]); });
    const lo = lines.reduce((s, l) => s + l[1], 0), hi = lines.reduce((s, l) => s + l[2], 0);
    return { lines, lo, hi };
  };
  const estHTML = () => {
    const e = estimate();
    if (!e.lines.length) return `<p class="small muted">${t("estEmpty")}</p>`;
    return `<ul>${e.lines.map((l) => `<li><span>${esc(l[0])}</span><span>${range(l[1], l[2])}</span></li>`).join("")}</ul><div class="total"><span class="caps">Total</span><strong>${range(e.lo, e.hi)}</strong></div>`;
  };
  const err = (id, on) => (on ? `<span class="err" id="${id}-err">${on}</span>` : "");

  const vRequest = (errors = {}) => {
    if (submitted) return vDone();
    const ty = t("types");
    const sel = form.urn ? URNS[form.urn] : null;
    const hasErr = Object.keys(errors).length > 0;
    return `<div class="wrap page">
      <div class="page-head"><h1 class="h1">${t("reqTitle")}</h1><p class="lede">${t("reqIntro")}</p></div>
      <div class="request">
        <form id="req" novalidate>
          ${hasErr ? `<div class="alert" role="alert">${t("eSummary")}</div>` : ""}
          <fieldset><legend>${t("lType")}</legend>
            <div class="chips">${ty.map((label, i) => `<label class="chip"><input type="radio" name="type" id="type-${i}" value="${i}" ${form.type === i ? "checked" : ""}><span>${label}</span></label>`).join("")}</div>
          </fieldset>
          <fieldset><legend>${t("lUrn")}</legend>
            <div class="field"><label for="urn">${t("urnLabel")}</label>
              <select id="urn" name="urn"><option value="">${t("urnNone")}</option>${MODELS.map((m) => `<optgroup label="${m.name}">${m.urns.map((u) => `<option value="${u}" ${String(form.urn) === String(u) ? "selected" : ""}>${m.name} ${n(u)} · ${esc(URNS[u].co[L()])}</option>`).join("")}</optgroup>`).join("")}</select>
            </div>
            <div id="urn-preview">${sel ? `<div class="preview">${ph(sel.m, "", sel.tint)}<div><p>${esc(sel.de[L()])}</p><a class="link" href="#urne-${form.urn}" data-go="urne-${form.urn}">${t("viewUrn")}</a></div></div>` : ""}</div>
          </fieldset>
          <fieldset><legend>${t("lOpts")}</legend>
            <div class="checks">${OPTIONS.map((o) => {
              const dis = o.id === "pouchc" && !form.opts.pouch;
              return `<label class="check ${dis ? "disabled" : ""}" id="row-${o.id}"><input type="checkbox" id="opt-${o.id}" data-opt="${o.id}" ${form.opts[o.id] && !dis ? "checked" : ""} ${dis ? "disabled" : ""}><span><span class="name">${o.name[L()]}</span><br><span class="hint">${dis ? t("pouchFirst") : o.de[L()]}</span></span><span class="price">${o.price ? "+ " + money(o.price) : "+ " + range(o.min, o.max)}</span></label>`;
            }).join("")}</div>
          </fieldset>
          <fieldset><legend>${t("lDate")}</legend>
            <div class="field" style="max-width:16rem"><label for="date">${t("dateLabel")}</label><input type="date" id="date" name="date" value="${esc(form.date)}" aria-describedby="date-hint"></div>
            <span class="hint" id="date-hint">${t("dateHint")}</span>
          </fieldset>
          <fieldset><legend>${t("lContact")}</legend>
            <div class="field"><label for="name">${t("name")} <span class="req">*</span></label><input type="text" id="name" name="name" autocomplete="name" value="${esc(form.name)}" ${errors.name ? `aria-invalid="true" aria-describedby="name-err"` : ""}>${err("name", errors.name)}</div>
            <div class="two">
              <div class="field"><label for="email">${t("email")} <span class="req">*</span></label><input type="email" id="email" name="email" autocomplete="email" value="${esc(form.email)}" ${errors.email ? `aria-invalid="true" aria-describedby="email-err"` : ""}>${err("email", errors.email)}</div>
              <div class="field"><label for="phone">${t("phone")} <span class="hint">(${t("optional")})</span></label><input type="tel" id="phone" name="phone" autocomplete="tel" value="${esc(form.phone)}" ${errors.phone ? `aria-invalid="true" aria-describedby="phone-err"` : ""}>${err("phone", errors.phone)}</div>
            </div>
            <div class="field"><span class="lbl" id="pref-lbl">${t("pref")}</span>
              <div class="radios" role="radiogroup" aria-labelledby="pref-lbl"><label><input type="radio" name="contact" id="contact-email" value="email" ${form.contact === "email" ? "checked" : ""}>${t("email")}</label><label><input type="radio" name="contact" id="contact-phone" value="phone" ${form.contact === "phone" ? "checked" : ""}>${t("phone")}</label></div>
            </div>
            <div class="field"><label for="message">${t("message")} ${form.type === 2 ? `<span class="req">*</span>` : `<span class="hint">(${t("optional")})</span>`}</label><textarea id="message" name="message" placeholder="${esc(t("msgHint"))}" ${errors.message ? `aria-invalid="true" aria-describedby="message-err"` : ""}>${esc(form.message)}</textarea>${err("message", errors.message)}</div>
          </fieldset>
          <div class="submit-row">
            <span class="inline-est" id="inline-est"></span>
            <div class="row"><button class="btn" type="submit">${t("submit")}</button></div>
            <span class="hint">${t("protoNote")}</span>
          </div>
        </form>
        <aside class="est" aria-live="polite"><h2 class="h2">${t("estimate")}</h2><div id="est">${estHTML()}</div><p class="hint">${t("estNote")}</p><p class="note">${t("leadTimes")}</p></aside>
      </div>
    </div>`;
  };

  const vDone = () => {
    const s = submitted, e = estimate();
    const opts = OPTIONS.filter((o) => s.opts[o.id] && (o.id !== "pouchc" || s.opts.pouch)).map((o) => o.name[L()]).join("\n") || t("none");
    const via = s.contact === "phone" ? t("viaPhone") : t("viaEmail");
    return `<div class="wrap page"><div class="done">
      <span class="eyebrow">${t("reqTitle").toLowerCase()}</span>
      <h1 class="h1">${t("thanks")}${esc(s.name)}.</h1>
      <p class="lede">${t("doneTx")}${via}.</p>
      <dl class="specs">
        <div><dt>${t("type")}</dt><dd>${t("types")[s.type]}</dd></div>
        <div><dt>${t("urnN")}</dt><dd>${s.urn ? urnLabel(+s.urn) : t("urnNone")}</dd></div>
        <div><dt>${t("lOpts")}</dt><dd>${esc(opts)}</dd></div>
        ${s.date ? `<div><dt>${t("date")}</dt><dd>${esc(s.date)}</dd></div>` : ""}
        <div><dt>${t("contactBy")}</dt><dd>${esc(s.name)}\n${esc(s.email)}${s.phone ? "\n" + esc(s.phone) : ""}</dd></div>
        ${s.message ? `<div><dt>${t("message")}</dt><dd>${esc(s.message)}</dd></div>` : ""}
        ${e.lines.length ? `<div class="price"><dt>${t("estimate")}</dt><dd>${range(e.lo, e.hi)}</dd></div>` : ""}
      </dl>
      <p class="hint">${t("protoNote")}</p>
      <div class="row"><button class="btn ghost" type="button" data-new>${t("newReq")}</button><a class="link" href="#accueil" data-go="accueil">${t("backHome")}</a></div>
    </div></div>`;
  };

  const refreshEstimate = () => {
    const box = document.getElementById("est"); if (box) box.innerHTML = estHTML();
    const inl = document.getElementById("inline-est"); if (inl) { const e = estimate(); inl.textContent = e.lines.length ? `${t("estimate")}${lang === "fr" ? " : " : ": "}${range(e.lo, e.hi)}` : ""; }
  };

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = t("eName");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) e.email = t("eEmail");
    if (form.contact === "phone" && form.phone.replace(/\D/g, "").length < 7) e.phone = t("ePhone");
    if (form.type === 2 && !form.message.trim()) e.message = t("eMsg");
    return e;
  };

  const bindForm = () => {
    const f = document.getElementById("req"); if (!f) return;
    refreshEstimate();
    f.addEventListener("input", (ev) => {
      const el = ev.target;
      if (el.dataset.opt) {
        form.opts[el.dataset.opt] = el.checked;
        if (el.dataset.opt === "pouch") {
          const c = document.getElementById("opt-pouchc"), row = document.getElementById("row-pouchc");
          c.disabled = !el.checked; if (!el.checked) { c.checked = false; form.opts.pouchc = false; }
          row.classList.toggle("disabled", !el.checked);
          row.querySelector(".hint").textContent = el.checked ? OPTIONS[3].de[L()] : t("pouchFirst");
        }
      } else if (el.name === "type") { form.type = +el.value; renderMain(); document.getElementById(`type-${form.type}`)?.focus(); return; }
      else if (el.name === "urn") { form.urn = el.value; renderMain(); document.getElementById("urn")?.focus(); return; }
      else if (el.name in form) form[el.name] = el.value;
      if (el.getAttribute("aria-invalid")) { el.removeAttribute("aria-invalid"); document.getElementById(el.id + "-err")?.remove(); }
      refreshEstimate();
    });
    f.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const e = validate();
      if (Object.keys(e).length) {
        document.getElementById("main").innerHTML = vRequest(e); bindForm();
        document.getElementById(Object.keys(e)[0])?.focus();
        return;
      }
      submitted = JSON.parse(JSON.stringify(form));
      renderMain(); window.scrollTo(0, 0);
    });
  };

  // ---------- chrome & routing ----------
  const NAV = [["urnes-de-papel", "navAbout"], ["tarifs", "navPrices"], ["artisane", "navArtisan"]];
  const renderChrome = () => {
    document.documentElement.lang = lang;
    document.getElementById("proto").textContent = t("proto");
    document.getElementById("head").innerHTML = `${logo()}<nav class="nav caps" aria-label="Navigation">${NAV.map(([r, k]) => `<a href="#${r}" data-go="${r}" ${route === r ? 'aria-current="page"' : ""}>${t(k)}</a>`).join("")}<a class="btn-line" href="#demande" data-go="demande" ${route === "demande" ? 'aria-current="page"' : ""}>${t("navRequest")}</a><span class="lang"><button type="button" data-lang="fr" aria-pressed="${lang === "fr"}">fr</button>/<button type="button" data-lang="en" aria-pressed="${lang === "en"}">en</button></span></nav>`;
    document.getElementById("foot").innerHTML = `<span>${t("rights")}</span><span>514 978 0118</span>`;
  };
  const renderMain = () => {
    const main = document.getElementById("main");
    const um = /^urne-(\d+)$/.exec(route);
    if (um && URNS[um[1]]) main.innerHTML = vUrn(+um[1]);
    else if (modelOf(route)) main.innerHTML = vCollection(modelOf(route));
    else if (route === "urnes-de-papel") main.innerHTML = vAbout();
    else if (route === "tarifs") main.innerHTML = vPrices();
    else if (route === "artisane") main.innerHTML = vArtisan();
    else if (route === "demande") { main.innerHTML = vRequest(); bindForm(); }
    else { route = "accueil"; main.innerHTML = vHome(); }
  };
  const render = () => { renderChrome(); renderMain(); };
  const go = (r, push = true) => {
    route = r || "accueil";
    if (push) { try { history.pushState(null, "", "#" + route); } catch (e) {} }
    render(); window.scrollTo(0, 0);
  };

  document.addEventListener("click", (ev) => {
    const a = ev.target.closest("[data-go]");
    if (a) { ev.preventDefault(); go(a.dataset.go); return; }
    const l = ev.target.closest("[data-lang]");
    if (l) { lang = l.dataset.lang; try { localStorage.setItem("udp-lang", lang); } catch (e) {} render(); return; }
    const rq = ev.target.closest("[data-request]");
    if (rq) { form.urn = rq.dataset.request; if (form.type === 2) form.type = 0; submitted = null; go("demande"); return; }
    if (ev.target.closest("[data-new]")) { form = blankForm(); submitted = null; renderMain(); window.scrollTo(0, 0); }
  });
  const fromHash = () => (location.hash || "").replace(/^#/, "");
  window.addEventListener("popstate", () => go(fromHash(), false));
  window.addEventListener("hashchange", () => { if (fromHash() !== route) go(fromHash(), false); });

  route = fromHash() || "accueil";
  render();
})();
</script>
